spring:
  application:
    name: salary-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salary}
    username: ${DB_USERNAME:salary}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  hr:
    username: ${HR_USERNAME:hr}
    password: ${HR_PASSWORD}
  demo:
    enabled: ${DEMO_SEED:false}
